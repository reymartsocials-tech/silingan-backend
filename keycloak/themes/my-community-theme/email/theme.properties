# Silingan email theme.
#
# parent=base gives us Keycloak's html/template.ftl (the emailLayout macro) and
# the stock message bundles, while every invitation template is overridden in
# html/ and text/ of this theme.
#
# Select this theme per realm with: Realm settings -> Themes -> Email theme
# (or "emailTheme": "my-community-theme" in the realm import JSON).
parent=base
locales=en
