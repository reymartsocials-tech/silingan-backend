spring:
  application:
    name: silingan
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/silingan}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:silingan}
    password: ${DATABASE_PASSWORD:silingan}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only asserts the entities match it.
      # Local profile overrides this to 'create-drop' (see bottom of file).
      ddl-auto: validate
    # Deliberately left at the default (true). UserContextFilter enables the Hibernate
    # "communityFilter" tenant-isolation filter on the request-bound session; with
    # open-in-view off no session exists at filter time and the isolation silently stops
    # applying to Announcement/Issue/Media. See the note in UserContextFilter before changing.
    # Note that Hibernate still releases the JDBC connection after each transaction, so this
    # does not pin a pool connection for the whole request.
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        session_factory:
          statement_inspector: com.ria.olita.tech.silingan.config.CommunityStatementInspector
    defer-datasource-initialization: false

  flyway:
    enabled: true
    # Flyway owns the SCHEMA only. Seed data is handled by spring.sql.init below.
    locations: classpath:db/migration

  sql:
    init:
      mode: never
      continue-on-error: false

  security:
    oauth2:
      client:
        registration:
          silingan:
            client-id: silingan-api
            client-secret: N8fhpvahIwkPdmMFLrHTdsZi89CnBOap
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8082/login/oauth2/code/silingan
            provider: silingan
        provider:
          silingan:
            # Explicit endpoints to avoid issuer discovery at startup
            authorization-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/token
            user-info-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          # Only use jwk-set-uri to avoid startup discovery
          jwk-set-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/certs

# ============================================
# Custom Keycloak Admin Configuration (Local Development)
# ============================================
keycloak:
  url: http://localhost:8080
  realm: silingan-platform
  client-id: silingan-backend
  client-secret: YVvWkbSHaxBM5o3l3Mqwr2jFYtBRmHK0
  token-client-id: silingan-api
  token-client-secret: N8fhpvahIwkPdmMFLrHTdsZi89CnBOap
  invitation-redirect-client-id: silingan-api
  invitation-redirect-uri: http://localhost:8082/
  invitation-lifespan-seconds: 86400

# ============================================
# Server Configuration
# ============================================
server:
  # SERVER_PORT - Port the application listens on
  port: ${SERVER_PORT:8083}

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    root: INFO
    com.ria.olita.tech.silingan.security: DEBUG
    org.springframework.security: DEBUG
    OTP_AUDIT: INFO


otp:
  length: 6
  expiration-minutes: 5
  max-attempts: 3
  cooldown-seconds: 60
  registration-proof-minutes: 10
  cache:
    max-size: 10000

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-me-please-at-least-32-bytes}
  issuer: ${JWT_ISSUER:silingan-backend}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

sms:
  provider: semaphore
  # Temporary toggle to keep OTP happy-path while SMS provider/sender-name setup is pending.
  bypass-sending: ${SMS_BYPASS_SENDING:true}
  semaphore:
    api-key: ${SEMAPHORE_API_KEY:59ba20c393afda146b89fa87c9c70ff6}
    sender-name: ${SEMAPHORE_SENDER_NAME:SILINGAN}




# ============================================
# Invitation handling
# ============================================
app:
  invitations:
    expiry-days: ${INVITATION_EXPIRY_DAYS:7}
    activation-gate:
      # How long a "nothing left to activate" result is trusted before the checks run again.
      # New invitations invalidate the entry directly, so this only bounds the case where that
      # invalidation did not reach this instance.
      settled-ttl: ${INVITATION_GATE_SETTLED_TTL:PT30M}
      # How long to wait before re-checking an invitee who is still mid-onboarding. Keep short:
      # this is the delay between the invitee finishing their Keycloak actions and gaining access.
      unsettled-ttl: ${INVITATION_GATE_UNSETTLED_TTL:PT30S}
      max-size: ${INVITATION_GATE_MAX_SIZE:50000}

# ============================================
# Local-profile overrides
# --------------------------------------------
# Loads the demo fixtures. Kept in a profile-scoped document so demo-data.sql
# is opt-in rather than opt-out and cannot leak into a shared environment by
# default.
# ============================================
---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      # Use Hibernate to create/drop schema locally (Flyway disabled below)
      ddl-auto: create-drop
  flyway:
    # Disable Flyway for local profile - Hibernate manages schema
    enabled: false
  sql:
    init:
      mode: never
      data-locations: classpath:db/data/demo-data.sql

