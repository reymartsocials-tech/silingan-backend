spring:
  application:
    name: silingan
  profiles:
    # Default profile for local development
    # Override with SPRING_PROFILES_ACTIVE=prod for production
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # Local development runs against the dockerised Postgres in docker-compose.yml
    # (`docker compose up -d silingan-db`). Postgres rather than H2 so that local,
    # dev and prod all run the exact same Flyway migrations -- partial unique
    # indexes and other Postgres-specific DDL cannot be tested on H2.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/silingan}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:silingan}
    password: ${DATABASE_PASSWORD:silingan}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only asserts the entities match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        session_factory:
          statement_inspector: com.ria.olita.tech.silingan.config.CommunityStatementInspector
    defer-datasource-initialization: false

  flyway:
    enabled: true
    # Flyway owns the SCHEMA only. Seed data is handled by spring.sql.init below.
    locations: classpath:db/migration

  sql:
    init:
      # No seed data by default: the staff role catalog is owned by code
      # (StaffRoleCatalog), not by reference-data rows. The `local` profile
      # document at the bottom of this file adds demo-data.sql; dev and prod
      # never load it.
      mode: never
      # Fail the boot on a bad script rather than starting with partial data.
      continue-on-error: false

  security:
    oauth2:
      client:
        registration:
          silingan:
            client-id: silingan-api
            client-secret: N8fhpvahIwkPdmMFLrHTdsZi89CnBOap
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8082/login/oauth2/code/silingan
            provider: silingan
        provider:
          silingan:
            # Explicit endpoints to avoid issuer discovery at startup
            authorization-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/token
            user-info-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          # Only use jwk-set-uri to avoid startup discovery
          jwk-set-uri: http://localhost:8080/realms/silingan-platform/protocol/openid-connect/certs

# ============================================
# Custom Keycloak Admin Configuration (Local Development)
# ============================================
keycloak:
  url: http://localhost:8080
  realm: silingan-platform
  client-id: silingan-backend
  client-secret: YVvWkbSHaxBM5o3l3Mqwr2jFYtBRmHK0
  token-client-id: silingan-api
  token-client-secret: N8fhpvahIwkPdmMFLrHTdsZi89CnBOap
  invitation-redirect-client-id: silingan-api
  invitation-redirect-uri: http://localhost:8082/
  invitation-lifespan-seconds: 86400

# ============================================
# Server Configuration
# ============================================
server:
  # SERVER_PORT - Port the application listens on
  port: ${SERVER_PORT:8082}

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    root: INFO
    com.ria.olita.tech.silingan.security: DEBUG
    org.springframework.security: DEBUG
    OTP_AUDIT: INFO


otp:
  length: 6
  expiration-minutes: 5
  max-attempts: 3
  cooldown-seconds: 60
  registration-proof-minutes: 10
  cache:
    max-size: 10000

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-me-please-at-least-32-bytes}
  issuer: ${JWT_ISSUER:silingan-backend}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

sms:
  provider: semaphore
  # Temporary toggle to keep OTP happy-path while SMS provider/sender-name setup is pending.
  bypass-sending: ${SMS_BYPASS_SENDING:true}
  semaphore:
    api-key: ${SEMAPHORE_API_KEY:59ba20c393afda146b89fa87c9c70ff6}
    sender-name: ${SEMAPHORE_SENDER_NAME:SILINGAN}




# ============================================
# Local-profile overrides
# --------------------------------------------
# Loads the demo fixtures. Kept in a profile-scoped document so demo-data.sql
# is opt-in rather than opt-out and cannot leak into a shared environment by
# default.
# ============================================
---
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      mode: always
      data-locations: classpath:db/data/demo-data.sql
