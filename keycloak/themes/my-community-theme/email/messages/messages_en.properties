# Silingan email theme messages.
#
# The invitation BODY is rendered entirely by html/executeActions.ftl and
# text/executeActions.ftl, which branch on the roleCode / invitationType user
# attributes. Body text therefore lives in those templates, not here.
#
# The SUBJECT is resolved by Keycloak from this bundle before the template is
# rendered, so it has no access to user attributes. Keep it role neutral; only a
# custom EmailTemplateProvider SPI could vary the subject per role.
#
# Args available to executeActionsSubject:
#   {0}=link  {1}=linkExpiration  {2}=realmName  {3}=requiredActions  {4}=formatted expiration
executeActionsSubject=Activate your Silingan account

requiredAction.CONFIGURE_TOTP=Configure OTP
requiredAction.TERMS_AND_CONDITIONS=Terms and Conditions
requiredAction.UPDATE_PASSWORD=Update Password
requiredAction.UPDATE_PROFILE=Update Profile
requiredAction.VERIFY_EMAIL=Verify Email
requiredAction.CONFIGURE_RECOVERY_AUTHN_CODES=Generate Recovery Codes
